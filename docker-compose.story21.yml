x-pipeline-image: &pipeline-image
  image: mrfpipeline:local
  build:
    context: .
    ssh:
      - default

x-pipeline-env: &pipeline-env
  MRFPIPELINE_DATABASE_URL: postgres://mrfpipeline:local-only@postgres/mrfpipeline?sslmode=disable
  MRFPIPELINE_ARTIFACT_ROOT: /var/lib/mrfpipeline/artifacts
  MRFPIPELINE_WAREHOUSE_PATH: /var/lib/mrfpipeline/warehouse
  MRFPIPELINE_PROVIDER_CATALOG_PATH: /etc/mrfpipeline/provider-catalog
  MRFPIPELINE_SERVICES_PATH: /etc/mrfpipeline/services.csv

x-pipeline-volumes: &pipeline-volumes
  - artifacts:/var/lib/mrfpipeline
  - ${MRFPIPELINE_PROVIDER_CATALOG_DIR:-./local/provider-catalog}:/etc/mrfpipeline/provider-catalog:ro
  - ${MRFPIPELINE_SERVICES_FILE:-./local/services.csv}:/etc/mrfpipeline/services.csv:ro

x-control-env: &control-env
  <<: *pipeline-env
  MRFPIPELINE_MRF_RESIDENT_CAPACITY: ${MRFPIPELINE_MRF_RESIDENT_CAPACITY:-2}

services:
  postgres:
    image: postgres:16
    restart: unless-stopped
    environment:
      POSTGRES_DB: mrfpipeline
      POSTGRES_USER: mrfpipeline
      POSTGRES_PASSWORD: local-only
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U mrfpipeline -d mrfpipeline"]
      interval: 2s
      timeout: 5s
      retries: 30

  migrate:
    <<: *pipeline-image
    command: ["migrate"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *pipeline-env
    volumes: *pipeline-volumes

  control:
    <<: *pipeline-image
    restart: "no"
    command: ["work", "--role", "control"]
    depends_on:
      migrate:
        condition: service_completed_successfully
    environment: *control-env
    volumes: *pipeline-volumes

  mrf:
    <<: *pipeline-image
    profiles: [workers]
    restart: "on-failure:5"
    command: ["work", "--role", "mrf"]
    depends_on:
      control:
        condition: service_started
    environment: *pipeline-env
    volumes: *pipeline-volumes

  consumer:
    <<: *pipeline-image
    profiles: [workers]
    restart: "on-failure:5"
    command: ["work", "--role", "consumer"]
    depends_on:
      control:
        condition: service_started
    environment: *pipeline-env
    volumes: *pipeline-volumes

  cli:
    <<: *pipeline-image
    profiles: [operator]
    entrypoint: ["/usr/local/bin/mrfpipeline"]
    depends_on:
      postgres:
        condition: service_healthy
    environment: *pipeline-env
    volumes: *pipeline-volumes

volumes:
  pgdata:
  artifacts:
