name: CI

on:
  push:
    branches: [master]
  pull_request:
    branches: [master]
  workflow_dispatch:

permissions:
  contents: read

jobs:
  verify:
    runs-on: ubuntu-latest
    env:
      GOPRIVATE: github.com/EnotPoloskun/*,github.com/enotpoloskun/mrfconsumer
    services:
      postgres:
        image: postgres:16
        env:
          POSTGRES_DB: mrfpipeline_test_ci
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres -d mrfpipeline_test_ci"
          --health-interval=5s
          --health-timeout=5s
          --health-retries=20

    steps:
      - name: Check private-module credential
        env:
          PRIVATE_MODULES_SSH_KEY: ${{ secrets.MRFPIPELINE_PRIVATE_MODULES_SSH_KEY }}
        run: |
          if [ -z "$PRIVATE_MODULES_SSH_KEY" ]; then
            echo "::error title=Missing private-module credential::Configure the MRFPIPELINE_PRIVATE_MODULES_SSH_KEY repository secret before relying on CI results."
            exit 1
          fi

      - uses: actions/checkout@v4

      - uses: actions/setup-go@v5
        with:
          go-version: '1.26.x'
          cache: true

      - name: Configure SSH module access
        uses: webfactory/ssh-agent@v0.9.0
        with:
          ssh-private-key: ${{ secrets.MRFPIPELINE_PRIVATE_MODULES_SSH_KEY }}

      - name: Prefer SSH for GitHub module fetches
        run: git config --global url."git@github.com:".insteadOf "https://github.com/"

      - name: Ordinary non-database tests
        run: go test ./...

      - name: Focused race tests
        run: go test -race ./internal/jobs ./internal/mrfparse ./internal/work ./internal/reconcile

      - name: Go vet
        run: go vet ./...

      - name: Validate Compose configuration
        env:
          COMPOSE_PROFILES: operator,workers
        run: docker compose -f docker-compose.story21.yml config --quiet

      - name: Build Compose image
        env:
          DOCKER_BUILDKIT: '1'
          COMPOSE_PROFILES: operator,workers
        run: docker compose -f docker-compose.story21.yml build

      - name: PostgreSQL integration suite
        env:
          MRFPIPELINE_TEST_DATABASE_URL: postgres://postgres:postgres@localhost:5432/mrfpipeline_test_ci?sslmode=disable
        run: go test -p 1 ./...
